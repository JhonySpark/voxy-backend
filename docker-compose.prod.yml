services:
  api:
    image: ghcr.io/jhonyspark/voxy-backend:latest
    container_name: voxy_api
    restart: unless-stopped
    # Removemos o "ports" público para forçar o acesso apenas via Nginx
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://voxy_redis:6379
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      # A URL agora será a pública HTTPS, e não o container interno
      - LIVEKIT_URL=https://livekit.d4rkside.com.br
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:alpine
    container_name: voxy_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: voxy_livekit
    restart: unless-stopped
    ports:
      # O WebRTC UDP precisa ser exposto publicamente para o streaming de vídeo funcionar
      - "7882:7882/udp"
      - "7881:7881/tcp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_RTC_UDP_PORT: "7882"
      LIVEKIT_RTC_TCP_PORT: "7881"
      LIVEKIT_RTC_USE_EXTERNAL_IP: "true"
      LIVEKIT_NODE_IP: "167.233.22.25"

  nginx:
    image: nginx:alpine
    container_name: voxy_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - livekit

volumes:
  redis_data:
